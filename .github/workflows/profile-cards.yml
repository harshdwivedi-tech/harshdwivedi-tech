
name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile statistics
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: harshdwivedi-tech
          cards: overview,languages,contributions,momentum
          layout: combined
          output-dir: assets
          themes: light,dark
          palette: blue
          language-limit: 8
          commit: true
          commit-message: "Update GitHub profile statistics"
